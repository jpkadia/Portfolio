<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="spaceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04162e"/>
      <stop offset="50%" stop-color="#072E60"/>
      <stop offset="100%" stop-color="#093a73"/>
    </linearGradient>
    <linearGradient id="tealCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12B9BC"/>
      <stop offset="100%" stop-color="#6FCFD3"/>
    </linearGradient>
    <linearGradient id="landerBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="thrusterFire" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#6FCFD3"/>
      <stop offset="70%" stop-color="#12B9BC"/>
      <stop offset="100%" stop-color="rgba(18, 185, 188, 0)"/>
    </linearGradient>
    <linearGradient id="goldFlame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="60%" stop-color="#FF9E00"/>
      <stop offset="100%" stop-color="rgba(255, 158, 0, 0)"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep Space Canvas -->
  <circle cx="256" cy="256" r="256" fill="url(#spaceBg)"/>

  <!-- Orbital Rings & Grid -->
  <circle cx="256" cy="256" r="238" fill="none" stroke="#12B9BC" stroke-width="2.5" stroke-dasharray="8 8" opacity="0.35"/>
  <circle cx="256" cy="256" r="218" fill="none" stroke="#6FCFD3" stroke-width="1.5" opacity="0.2"/>

  <!-- Stars in Background -->
  <circle cx="110" cy="90" r="2" fill="#ffffff" opacity="0.8"/>
  <circle cx="410" cy="110" r="2" fill="#ffffff" opacity="0.8"/>
  <circle cx="95" cy="360" r="2" fill="#ffffff" opacity="0.7"/>
  <circle cx="430" cy="340" r="2.5" fill="#6FCFD3" opacity="0.8"/>
  <circle cx="256" cy="70" r="2" fill="#ffffff" opacity="0.6"/>

  <!-- Sparkling Cross Stars -->
  <path d="M120 160 Q120 172 132 172 Q120 172 120 184 Q120 172 108 172 Q120 172 120 160 Z" fill="#6FCFD3"/>
  <path d="M390 175 Q390 187 402 187 Q390 187 390 199 Q390 187 378 187 Q390 187 390 175 Z" fill="#12B9BC"/>

  <!-- Launch Planet (Top Left) -->
  <g filter="url(#softGlow)">
    <circle cx="115" cy="120" r="42" fill="url(#tealCyan)" opacity="0.9"/>
    <!-- Planet Ring -->
    <ellipse cx="115" cy="120" rx="65" ry="16" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.75" transform="rotate(-25 115 120)"/>
  </g>

  <!-- Destination / Landing Planet (Bottom Right) -->
  <g filter="url(#softGlow)">
    <circle cx="395" cy="360" r="54" fill="#072E60" stroke="#12B9BC" stroke-width="3.5"/>
    <ellipse cx="380" cy="345" rx="14" ry="9" fill="#12B9BC" opacity="0.4"/>
    <ellipse cx="420" cy="375" rx="18" ry="11" fill="#12B9BC" opacity="0.3"/>
    <ellipse cx="395" cy="390" rx="12" ry="7" fill="#6FCFD3" opacity="0.4"/>
  </g>

  <!-- Orbit Flight Trajectory Curve -->
  <path d="M 145 145 Q 260 120 280 200 T 365 325" fill="none" stroke="#6FCFD3" stroke-width="3" stroke-dasharray="7 6" opacity="0.65"/>

  <!-- Floating Asteroids in Path -->
  <polygon points="200,105 212,112 216,125 204,130 194,120" fill="#64748b" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="325,120 338,124 342,136 330,144 320,132" fill="#64748b" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="345,260 354,264 358,274 348,280 340,270" fill="#64748b" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Thruster Propulsion Flame -->
  <g filter="url(#softGlow)">
    <!-- Cyan Flame -->
    <polygon points="244,282 268,282 256,345" fill="url(#thrusterFire)"/>
    <!-- Gold Core Flame -->
    <polygon points="248,282 264,282 256,325" fill="url(#goldFlame)"/>
  </g>

  <!-- 3D Lander Spacecraft Module -->
  <g filter="url(#softGlow)">
    <!-- Lander Upper Command Pod (Capsule / Cockpit) -->
    <polygon points="256,165 285,195 278,230 234,230 227,195" fill="url(#landerBody)" stroke="#072E60" stroke-width="3"/>
    <!-- Cockpit Visor / Glass -->
    <ellipse cx="256" cy="198" rx="18" ry="12" fill="#072E60"/>
    <ellipse cx="254" cy="196" rx="12" ry="7" fill="#12B9BC"/>
    <ellipse cx="251" cy="193" rx="5" ry="3" fill="#ffffff" opacity="0.8"/>

    <!-- Service Module / Equipment Section -->
    <rect x="228" y="230" width="56" height="36" rx="4" fill="url(#tealCyan)" stroke="#072E60" stroke-width="2.5"/>
    <line x1="228" y1="248" x2="284" y2="248" stroke="#072E60" stroke-width="2"/>
    <circle cx="242" cy="248" r="4" fill="#ffffff"/>
    <circle cx="270" cy="248" r="4" fill="#ffffff"/>

    <!-- Main Engine Nozzle -->
    <polygon points="242,266 270,266 275,282 237,282" fill="#072E60"/>

    <!-- Left Landing Gear Leg -->
    <line x1="230" y1="250" x2="195" y2="295" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="234" y1="262" x2="202" y2="290" stroke="#6FCFD3" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="193" cy="297" rx="10" ry="4" fill="url(#tealCyan)" stroke="#072E60" stroke-width="2"/>

    <!-- Right Landing Gear Leg -->
    <line x1="282" y1="250" x2="317" y2="295" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="278" y1="262" x2="310" y2="290" stroke="#6FCFD3" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="319" cy="297" rx="10" ry="4" fill="url(#tealCyan)" stroke="#072E60" stroke-width="2"/>

    <!-- Antenna Array -->
    <line x1="256" y1="165" x2="256" y2="148" stroke="#ffffff" stroke-width="3"/>
    <circle cx="256" cy="146" r="5" fill="#6FCFD3"/>
    <line x1="275" y1="178" x2="290" y2="162" stroke="#6FCFD3" stroke-width="2.5"/>
    <circle cx="292" cy="160" r="3.5" fill="#ffffff"/>
  </g>

  <!-- Bottom Brand Text Badge -->
  <g transform="translate(146, 412)">
    <rect x="0" y="0" width="220" height="38" rx="19" fill="url(#tealCyan)"/>
    <text x="110" y="26" font-family="'Poppins', 'Segoe UI', sans-serif" font-size="17" font-weight="800" fill="#072E60" text-anchor="middle" letter-spacing="2">ORBIT LANDER</text>
  </g>
</svg>
