<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="docBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#072E60"/>
      <stop offset="100%" stop-color="#0a3c7a"/>
    </linearGradient>
    <linearGradient id="tealCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12B9BC"/>
      <stop offset="100%" stop-color="#6FCFD3"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="256" cy="256" r="256" fill="url(#docBg)"/>

  <!-- Subtle Inner Tech Ring -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="#12B9BC" stroke-width="2.5" stroke-dasharray="8 8" opacity="0.4"/>
  <circle cx="256" cy="256" r="216" fill="none" stroke="#6FCFD3" stroke-width="1.5" opacity="0.25"/>

  <!-- Glowing Medical Cross with Rounded Corners -->
  <g filter="url(#softGlow)">
    <rect x="226" y="125" width="60" height="180" rx="20" fill="url(#tealCyan)" opacity="0.95"/>
    <rect x="166" y="185" width="180" height="60" rx="20" fill="url(#tealCyan)" opacity="0.95"/>
  </g>

  <!-- Stethoscope Outline -->
  <path d="M190 200 C190 285 322 285 322 200 V155" 
        fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
  
  <!-- Ear Tips -->
  <circle cx="190" cy="155" r="11" fill="#6FCFD3"/>
  <circle cx="322" cy="155" r="11" fill="#6FCFD3"/>

  <!-- Stethoscope Tube Down to Chestpiece -->
  <path d="M256 265 V315 C256 348 285 370 318 370 C348 370 368 348 368 322" 
        fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Stethoscope Chestpiece -->
  <circle cx="368" cy="320" r="22" fill="#12B9BC" stroke="#ffffff" stroke-width="6"/>
  <circle cx="368" cy="320" r="10" fill="#ffffff"/>

  <!-- ECG Heartbeat / AI Pulse Line in Center -->
  <path d="M145 215 H195 L212 170 L232 255 L256 195 L276 240 L292 215 H367" 
        fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)"/>

  <!-- AI Sparks / Intelligence Stars -->
  <path d="M380 110 Q380 135 400 135 Q380 135 380 160 Q380 135 360 135 Q380 135 380 110 Z" fill="#6FCFD3"/>
  <path d="M135 135 Q135 150 150 150 Q135 150 135 165 Q135 150 120 150 Q135 150 135 135 Z" fill="#12B9BC"/>
  <path d="M155 355 Q155 368 168 368 Q155 368 155 381 Q155 368 142 368 Q155 368 155 355 Z" fill="#6FCFD3" opacity="0.85"/>
  
  <!-- "GEN AI" Tech Badge at Bottom -->
  <g transform="translate(196, 405)">
    <rect x="0" y="0" width="120" height="38" rx="19" fill="url(#tealCyan)"/>
    <text x="60" y="26" font-family="'Poppins', 'Segoe UI', sans-serif" font-size="20" font-weight="800" fill="#072E60" text-anchor="middle" letter-spacing="2">GEN AI</text>
  </g>
</svg>